name: Checks

# Reusable quality gate: lint, typecheck, unit tests, API end-to-end tests on a
# real PostgreSQL, builds, and the native helper (vet, gofmt, race tests).
# Called by ci.yml (every push/PR), deploy.yml and release.yml — nothing is
# deployed or released unless every job here passes.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  typescript:
    name: Lint, typecheck, unit + API tests, builds
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: passvault
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: passvault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U passvault" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://passvault:ci-only-not-a-secret@127.0.0.1:5432/passvault_test
      TEST_DATABASE_URL: postgresql://passvault:ci-only-not-a-secret@127.0.0.1:5432/passvault_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @passvault/types build && pnpm --filter @passvault/validation build
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Typecheck
        run: pnpm --filter @passvault/api prisma:generate && pnpm -r run typecheck
      - name: Unit tests (crypto, validation, env-parser, sync, vault-core, extension, desktop)
        run: pnpm -r --workspace-concurrency=1 --filter './packages/*' --filter @passvault/browser-extension --filter @passvault/desktop run test
      - name: API e2e tests (real PostgreSQL)
        run: pnpm --filter @passvault/api test
      - name: Build API, web and extension
        run: pnpm --filter @passvault/api build && pnpm --filter @passvault/web build && pnpm --filter @passvault/browser-extension build
      - name: Dependency audit (fails on high/critical)
        run: pnpm audit --prod --audit-level=high

  native-helper:
    name: Native helper (Go)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/desktop-helper/go.mod
          cache-dependency-path: native/desktop-helper/go.sum
      - name: gofmt, vet and tests (keychain tests skipped on CI runners)
        working-directory: native/desktop-helper
        env:
          PV_SKIP_KEYCHAIN_TESTS: '1'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "::error::gofmt needed: $unformatted"; exit 1; fi
          go vet ./...
          go test -race ./...
      - name: Universal build
        working-directory: native/desktop-helper
        run: make universal && lipo -info bin/pv-helper-universal

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse committed env files and private keys
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$'; then echo "Committed .env file"; exit 1; fi
          if git grep -nE 'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY' -- ':!**/test/**' ':!**/*_test.go' ':!docs/**'; then echo "Private key committed"; exit 1; fi
