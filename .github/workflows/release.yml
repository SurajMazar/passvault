name: Release

# Builds and publishes the macOS desktop app and the Chrome extension.
#
#   git tag v0.1.0 && git push origin v0.1.0      # or run manually (workflow_dispatch)
#
# Repository VARIABLES (Settings → Secrets and variables → Actions → Variables):
#   PV_PRODUCTION_URL    https URL of your PassVault server (baked into both clients)   [required]
#   PV_WEB_URL           web dashboard URL (defaults to PV_PRODUCTION_URL)
#
# Optional SECRETS for a signed + notarized desktop app (otherwise an UNSIGNED, ad-hoc
# signed DMG is published and clearly labelled):
#   MACOS_CERT_P12_BASE64   base64 of the "Developer ID Application" certificate + key (.p12)
#   MACOS_CERT_PASSWORD     password of that .p12
#   APPLE_TEAM_ID           10-character Team ID
#   APPLE_ID                Apple ID e-mail used for notarization
#   APPLE_APP_PASSWORD      app-specific password for that Apple ID
#   MACOS_PROVISIONING_PROFILE_BASE64  (optional) Developer ID provisioning profile enabling
#                                       the keychain-access group for Touch ID unlock
#
# Optional SECRETS to publish the extension to the Chrome Web Store (otherwise the zip is
# attached to the GitHub release for manual upload):
#   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0). Must match the versions of the apps that are built.'
        required: true
      build_apps:
        description: 'Rebuild the macOS app and the extension even if their code did not change'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Tests (lint, typecheck, unit, API e2e, Go)
    uses: ./.github/workflows/checks.yml

  verify:
    name: Versions and what changed since the last release
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      previous: ${{ steps.changes.outputs.previous }}
      desktop: ${{ steps.changes.outputs.desktop }}
      extension: ${{ steps.changes.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Releases are made from main only
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG ($GITHUB_SHA) is not on main"; exit 1; }
      - id: changes
        name: Rebuild only the apps whose code changed
        env:
          FORCE: ${{ github.event.inputs.build_apps || 'false' }}
        run: |
          # previous release = highest v*.*.* tag below this one
          prev="$(git tag --list 'v*.*.*' | grep -vx "$TAG" | { cat; echo "$TAG"; } | sort -V | grep -B1 -x "$TAG" | head -1 | grep -vx "$TAG" || true)"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          if [ -z "$prev" ] || [ "$FORCE" = "true" ]; then
            desktop=true; extension=true
            echo "No previous release (or forced): building both apps."
          else
            changed="$(git diff --name-only "$prev" HEAD)"
            # shared packages bundled into both apps
            shared='^packages/'
            desktop=false; extension=false
            echo "$changed" | grep -Eq "^(apps/desktop/|native/desktop-helper/)|$shared" && desktop=true
            echo "$changed" | grep -Eq "^apps/browser-extension/|$shared" && extension=true
            echo "Changes since $prev: desktop=$desktop extension=$extension"
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "extension=$extension" >> "$GITHUB_OUTPUT"
      - id: v
        name: Tag must match the versions of the apps being built
        env:
          DESKTOP: ${{ steps.changes.outputs.desktop }}
          EXTENSION: ${{ steps.changes.outputs.extension }}
        run: |
          version="${TAG#v}"
          check() { pv=$(node -p "require('./$1').version"); [ "$pv" = "$version" ] || { echo "::error::$1 is $pv but the tag is $TAG (bump it or skip that app)"; exit 1; }; }
          [ "$DESKTOP" = "true" ] && check apps/desktop/package.json
          [ "$EXTENSION" = "true" ] && check apps/browser-extension/package.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - name: Production URL is configured
        env:
          PV_PRODUCTION_URL: ${{ vars.PV_PRODUCTION_URL }}
        run: |
          case "$PV_PRODUCTION_URL" in https://*) ;; *) echo "::error::Set the repository variable PV_PRODUCTION_URL to your https server URL"; exit 1 ;; esac

  extension:
    name: Chrome extension
    needs: verify
    if: needs.verify.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (production URLs from repository variables)
        env:
          VITE_API_URL: ${{ vars.PV_PRODUCTION_URL }}
          VITE_WEB_URL: ${{ vars.PV_WEB_URL || vars.PV_PRODUCTION_URL }}
        run: pnpm --filter @passvault/browser-extension build
      - name: Check manifest (MV3, minimal permissions, server host permission)
        env:
          PV_PRODUCTION_URL: ${{ vars.PV_PRODUCTION_URL }}
        run: |
          node -e '
            const m = require("./apps/browser-extension/dist/manifest.json");
            const origin = new URL(process.env.PV_PRODUCTION_URL).origin + "/*";
            if (m.manifest_version !== 3) throw new Error("not MV3");
            if (JSON.stringify(m.host_permissions) !== JSON.stringify([origin])) throw new Error("unexpected host_permissions " + JSON.stringify(m.host_permissions));
            for (const p of ["<all_urls>", "tabs", "webRequest", "nativeMessaging"]) if ((m.permissions || []).includes(p)) throw new Error("forbidden permission " + p);
            console.log("manifest ok:", m.version, m.host_permissions);
          '
      - name: Package
        run: |
          pnpm --filter @passvault/browser-extension zip
          mkdir -p out/install out/store
          cp apps/browser-extension/passvault-extension-*-chrome-web-store.zip out/store/
          rm apps/browser-extension/passvault-extension-*-chrome-web-store.zip
          cp apps/browser-extension/passvault-extension-*.zip out/install/
      # Uploaded as-is (no wrapper zip): the run page offers the file itself, never a zip inside a zip.
      # archive: false takes a single file, so each zip is its own artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: out/install/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: out/store/*.zip
          if-no-files-found: error
      - name: Publish to the Chrome Web Store (when credentials are configured)
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CWS_EXTENSION_ID" ] || [ -z "$CWS_REFRESH_TOKEN" ]; then
            echo "Chrome Web Store credentials not configured — the store zip is attached to the GitHub release for manual upload."
            exit 0
          fi
          token=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
          echo "::add-mask::$token"
          curl -fsS -X PUT -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -T out/store/passvault-extension-*-chrome-web-store.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID" | tee upload.json
          node -e 'const r=require("./upload.json"); if (r.uploadState !== "SUCCESS") { console.error(r); process.exit(1) }'
          curl -fsS -X POST -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish"

  desktop:
    name: macOS desktop app
    needs: verify
    if: needs.verify.outputs.desktop == 'true'
    runs-on: macos-14
    env:
      SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/desktop-helper/go.mod
          cache-dependency-path: native/desktop-helper/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Helper tests
        working-directory: native/desktop-helper
        env:
          PV_SKIP_KEYCHAIN_TESTS: '1'
        run: go test ./...
      - name: Build PassVault.app (universal)
        env:
          VITE_API_URL: ${{ vars.PV_PRODUCTION_URL }}
          VITE_WEB_URL: ${{ vars.PV_WEB_URL || vars.PV_PRODUCTION_URL }}
          VITE_PRODUCTION_URL: ${{ vars.PV_PRODUCTION_URL }}
          ARCHS: universal
          HELPER_LAYOUT: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 != '' && 'bundle' || 'flat' }}
        run: |
          bash apps/desktop/scripts/build.sh
          lipo -info apps/desktop/dist/PassVault.app/Contents/MacOS/passvault-shell

      - name: Import signing certificate and notarization credentials
        if: env.SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          PROFILE_B64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          existing=()
          while IFS= read -r k; do existing+=("$(echo "$k" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials passvault-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          if [ -n "$PROFILE_B64" ]; then
            echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/passvault.provisionprofile"
            echo "PROVISIONING_PROFILE=$RUNNER_TEMP/passvault.provisionprofile" >> "$GITHUB_ENV"
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, DMG
        if: env.SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PROFILE: passvault-notary
        run: |
          bash apps/desktop/scripts/sign-and-notarize.sh apps/desktop/dist/PassVault.app
          mkdir -p out
          cp apps/desktop/dist/PassVault-*.dmg "out/PassVault-${TAG#v}-macos-universal.dmg"
          spctl --assess --type open --context context:primary-signature -v "out/PassVault-${TAG#v}-macos-universal.dmg"

      - name: Unsigned DMG (no Apple credentials configured)
        if: env.SIGNING != 'true'
        run: |
          echo "::notice::Apple signing secrets are not configured — publishing an UNSIGNED (ad-hoc signed) build. macOS Gatekeeper will block it until the user explicitly allows it."
          mkdir -p out dmg
          cp -R apps/desktop/dist/PassVault.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "PassVault" -srcfolder dmg -ov -format UDZO "out/PassVault-${TAG#v}-macos-universal-UNSIGNED.dmg"

      - name: Clean up keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Uploaded as-is (no wrapper zip): the run page offers the file itself, never a zip inside a zip.
          archive: false
          path: out/*.dmg
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [verify, extension, desktop]
    # runs when the apps were built or deliberately skipped (unchanged), never after a failure
    if: >-
      always() && needs.verify.result == 'success' &&
      !contains(fromJSON('["failure","cancelled"]'), needs.extension.result) &&
      !contains(fromJSON('["failure","cancelled"]'), needs.desktop.result)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - if: needs.verify.outputs.desktop == 'true' || needs.verify.outputs.extension == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
          # the extension zip and the DMG are direct uploads: keep them as they are
          skip-decompress: true
      - name: Checksums
        run: |
          mkdir -p artifacts && cd artifacts
          if ls -- * >/dev/null 2>&1; then sha256sum -- * > SHA256SUMS.txt; cat SHA256SUMS.txt; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          PV_PRODUCTION_URL: ${{ vars.PV_PRODUCTION_URL }}
          PREV: ${{ needs.verify.outputs.previous }}
          DESKTOP: ${{ needs.verify.outputs.desktop }}
          EXTENSION: ${{ needs.verify.outputs.extension }}
        run: |
          repo="https://github.com/${GITHUB_REPOSITORY}"
          {
            echo "## PassVault ${TAG}"
            echo
            echo "Server: ${PV_PRODUCTION_URL}"
            echo
            echo "| Component | In this release |"
            echo "|---|---|"
            echo "| Server (API + web dashboard) | deployed by the Deploy workflow |"
            if [ "$DESKTOP" = "true" ]; then
              echo "| macOS app | \`PassVault-*-macos-universal*.dmg\` — macOS 14+, Apple silicon and Intel. **UNSIGNED** files are not notarized. |"
            else
              echo "| macOS app | unchanged — use the one from [${PREV}](${repo}/releases/tag/${PREV}) |"
            fi
            if [ "$EXTENSION" = "true" ]; then
              echo "| Chrome extension | \`passvault-extension-<version>.zip\` — Chrome / Edge / Brave (Manifest V3), to install from this page. \`…-chrome-web-store.zip\` is the same build for a Chrome Web Store upload. |"
            else
              echo "| Chrome extension | unchanged — use the one from [${PREV}](${repo}/releases/tag/${PREV}) |"
            fi
            if [ "$DESKTOP" = "true" ] || [ "$EXTENSION" = "true" ]; then
              echo
              echo "### Install"
              echo
              echo "**Verify first:** \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\` → every file must say OK."
            fi
            if [ "$DESKTOP" = "true" ]; then
              echo
              echo "**macOS app**"
              echo "1. Open the .dmg and drag **PassVault** to **Applications**, then open it."
              echo "2. UNSIGNED build: macOS blocks the first launch — open **System Settings → Privacy & Security** and click **Open Anyway** next to \"PassVault was blocked\". (Touch ID unlock needs a signed build.)"
              echo "3. The sign-in screen shows **Server · Production**; **Change** switches to local development. Sign in with your email, master password and authenticator code."
              echo "4. Updating: quit PassVault and replace the app in Applications."
            fi
            if [ "$EXTENSION" = "true" ]; then
              echo
              echo "**Chrome extension**"
              echo "1. Unzip \`passvault-extension-<version>.zip\` (not the \`-chrome-web-store\` one) into a folder you keep (Chrome loads it from there)."
              echo "2. Open \`chrome://extensions\`, enable **Developer mode**, click **Load unpacked**, choose the folder, and pin PassVault."
              echo "3. Sign in. **Change** on the sign-in screen selects production, local development or another https server."
              echo "4. Updating: unzip the new version over the same folder and click **reload** on the extension card."
              echo "5. Touch ID (Mac): PassVault for Mac → Settings → **Touch ID in the browser extension**, then in the extension Settings → **Unlock with Touch ID**."
            fi
            echo
            echo "New here? Create your account in the web dashboard at ${PV_PRODUCTION_URL} first. Full guide: [docs/INSTALL.md](${repo}/blob/${TAG}/docs/INSTALL.md)."
            if [ -n "$PREV" ]; then echo; echo "Changes since ${PREV}: ${repo}/compare/${PREV}...${TAG}"; fi
            echo
            echo "PassVault has not yet been independently audited — see docs/SECURITY_REVIEW.md and docs/security/."
          } > notes.md
          cat notes.md
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          files=()
          for f in artifacts/*; do [ -f "$f" ] && files+=("$f"); done
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "PassVault $TAG" --notes-file notes.md --target "$GITHUB_SHA" $flags
