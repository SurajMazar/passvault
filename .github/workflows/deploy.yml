name: Deploy

# Deploys the API (container image) and the web dashboard to the production
# server (docs/DEPLOYMENT.md → "Shared host with nginx + PostgreSQL").
#
#   git push origin main                           # a push to main that changes the server's code deploys (after the checks pass)
#   or: Actions → Deploy → Run workflow on main    # redeploy (e.g. after changing SMTP/DB secrets)
# Only the main branch can deploy: other branches and tags never do.
#
# The server's whole PassVault state is applied from git + these settings on every
# deploy (deploy/server/apply.sh): .env, database role/database, TLS certificate,
# nginx site and the container. Nothing is configured on the server by hand
# (except the one-time entry point for the deploy key: deploy/server/bootstrap.sh).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   PV_PRODUCTION_URL      https URL of the server, e.g. https://vault.example.com      [required]
#   PV_WEB_URL             dashboard URL if different (defaults to PV_PRODUCTION_URL)
#   DEPLOY_HOST            server address (IP or host name)                             [required]
#   DEPLOY_USER            SSH user (default root)
#   DEPLOY_KNOWN_HOSTS     output of `ssh-keyscan -t ed25519 <DEPLOY_HOST>`               [required]
#   PV_API_PORT            loopback port for the API container (default 3100)
#   MAIL_FROM              sender, e.g. PassVault <no-reply@example.com>
#   PV_EXTRA_CORS_ORIGINS  extra allowed origins, comma separated (e.g. chrome-extension://<id>)
#   LOG_LEVEL              API log level (default info)
#   REGISTRATION_OPEN      false closes sign-up on this server (default true); clients see it in /api/v1/meta
#   ACME_EMAIL             Let's Encrypt account email (only needed on a host without a certbot account)
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   DEPLOY_SSH_KEY         key restricted to /opt/passvault/bin/ci-deploy on the server     [required]
#   DATABASE_URL           postgresql://USER:PASSWORD@HOST:5432/DB                         [required]
#                          HOST=host.docker.internal → the host's PostgreSQL; the role (with this
#                          password), the database and the pg_hba rule are created/updated on deploy
#   MFA_ENCRYPTION_KEY, RECOVERY_CODE_PEPPER, PRELOGIN_SECRET                              [required]
#                          `openssl rand -base64 32` each. Never change them once users exist:
#                          MFA secrets and recovery codes in the database depend on them.
#   SMTP_HOST, SMTP_PORT [required], SMTP_SECURE, SMTP_USER, SMTP_PASSWORD   mail provider
#
# Pending Prisma migrations run on every deploy (prisma migrate deploy, at container start).

on:
  push:
    branches: [main]
    # Only what the server is built from: the Mac app, the browser extension, the
    # native helper and docs ship through the Release workflow, never here.
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'deploy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Tests (lint, typecheck, unit, API e2e, Go)
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy to production
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check configuration
        env:
          PV_PRODUCTION_URL: ${{ vars.PV_PRODUCTION_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
          HAS_MFA: ${{ secrets.MFA_ENCRYPTION_KEY != '' }}
          HAS_PEPPER: ${{ secrets.RECOVERY_CODE_PEPPER != '' }}
          HAS_PRELOGIN: ${{ secrets.PRELOGIN_SECRET != '' }}
          HAS_SMTP: ${{ secrets.SMTP_HOST != '' && secrets.SMTP_PORT != '' }}
        run: |
          fail=0
          for s in HAS_DB:DATABASE_URL HAS_MFA:MFA_ENCRYPTION_KEY HAS_PEPPER:RECOVERY_CODE_PEPPER HAS_PRELOGIN:PRELOGIN_SECRET HAS_SMTP:SMTP_HOST/SMTP_PORT; do
            v="${s%%:*}"; [ "${!v}" = "true" ] || { echo "::error::Add the repository secret ${s#*:}"; fail=1; }
          done
          case "$PV_PRODUCTION_URL" in https://*) ;; *) echo "::error::Set the repository variable PV_PRODUCTION_URL (https://…)"; fail=1 ;; esac
          [ -n "$DEPLOY_HOST" ] || { echo "::error::Set the repository variable DEPLOY_HOST"; fail=1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::Set the repository variable DEPLOY_KNOWN_HOSTS (ssh-keyscan output)"; fail=1; }
          [ "$HAS_KEY" = "true" ] || { echo "::error::Add the repository secret DEPLOY_SSH_KEY"; fail=1; }
          exit $fail

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @passvault/types build && pnpm --filter @passvault/validation build

      - name: Build web dashboard
        env:
          VITE_API_URL: ${{ vars.PV_PRODUCTION_URL }}
          VITE_WEB_URL: ${{ vars.PV_WEB_URL || vars.PV_PRODUCTION_URL }}
        run: pnpm --filter @passvault/web build

      - name: Build API image (linux/amd64)
        id: img
        run: |
          ID="$(git rev-parse --short=12 HEAD)"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          docker build -f apps/api/Containerfile -t "passvault-api:$ID" .
          mkdir -p release
          docker save "passvault-api:$ID" | gzip > release/api-image.tar.gz
          cp -R apps/web/dist release/web
          mkdir -p release/server
          cp deploy/server/apply.sh deploy/server/compose.yaml deploy/server/nginx.conf.template deploy/server/nginx-headers.conf release/server/
          ls -la release

      - name: Configuration and secrets for the server
        env:
          PV_PRODUCTION_URL: ${{ vars.PV_PRODUCTION_URL }}
          PV_API_PORT: ${{ vars.PV_API_PORT || '3100' }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          PV_EXTRA_CORS_ORIGINS: ${{ vars.PV_EXTRA_CORS_ORIGINS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          REGISTRATION_OPEN: ${{ vars.REGISTRATION_OPEN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          RECOVERY_CODE_PEPPER: ${{ secrets.RECOVERY_CODE_PEPPER }}
          PRELOGIN_SECRET: ${{ secrets.PRELOGIN_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          umask 077
          PV_DOMAIN="$(node -p 'new URL(process.env.PV_PRODUCTION_URL).hostname')"
          export PV_DOMAIN
          : > release/runtime.env
          for k in PV_DOMAIN PV_API_PORT MAIL_FROM PV_EXTRA_CORS_ORIGINS LOG_LEVEL REGISTRATION_OPEN ACME_EMAIL DATABASE_URL MFA_ENCRYPTION_KEY RECOVERY_CODE_PEPPER PRELOGIN_SECRET SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASSWORD; do
            v="${!k}"
            case "$v" in *$'\n'*) echo "::error::$k must be a single line"; exit 1 ;; esac
            printf '%s=%s\n' "$k" "$v" >> release/runtime.env
            [ -n "$v" ] && echo "$k: set" || echo "$k: (empty)"
          done

      - name: Ship and activate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          ID: ${{ steps.img.outputs.id }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key may only run /opt/passvault/bin/ci-deploy; the action is passed as the command.
          tar -C release -czf - . | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy $ID"
          rm -f ~/.ssh/deploy_key release/runtime.env

      - name: Smoke test
        env:
          PV_PRODUCTION_URL: ${{ vars.PV_PRODUCTION_URL }}
        run: |
          curl -fsS "$PV_PRODUCTION_URL/api/v1/health" | tee /dev/stderr | grep -q '"status":"ok"'
          # clients check this before connecting (Settings → Server connection)
          curl -fsS "$PV_PRODUCTION_URL/api/v1/meta" | tee /dev/stderr | grep -q '"service":"passvault"'
          curl -fsS -o /dev/null -w "web %{http_code}\n" "$PV_PRODUCTION_URL/"
